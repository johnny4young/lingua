name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a new commit lands on the same branch /
# PR — the older run becomes irrelevant the moment a fix is pushed,
# so finishing it is pure waste of GitHub Actions budget.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token: CI only reads the repo and runs gates;
# nothing here needs write scope. Jobs can still escalate per-job if a
# future step requires it.
permissions:
  contents: read

jobs:
  # All Linux gates collapsed into one job so we pay one pnpm install per
  # run instead of six times. Each gate stays distinct as a named step
  # so failures still pinpoint exactly what broke. ~5 min saved per
  # run vs six parallel jobs.
  linux-gates:
    name: Linux gates (build + typecheck + lint + i18n + changelog + test + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
          # implementation — also key the pnpm cache on the
          # update-server lockfile so the worker's install (added
          # below) reuses cached deps instead of taking a cold install
          # on every CI run.
          cache-dependency-path: |
            pnpm-lock.yaml
            license-server/pnpm-lock.yaml
            update-server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      # implementation detail — the root tsconfig only includes src/**, so the
      # `tsc --noEmit` above never type-checks files under tests/. This
      # scoped pass pulls tests/main/projectCapabilitiesBrand.test.ts into
      # a real tsc program so its `@ts-expect-error` swap matrix becomes a
      # gate: revert any branded id to a bare string and this step fails
      # with TS2578 'unused @ts-expect-error directive'. The vitest run
      # below also enforces this via a shell-out, but this step fails fast
      # and pinpoints the regression.
      - name: Type check (tests compile guards)
        run: pnpm run typecheck:tests
      - name: Lint
        run: pnpm run lint
      - name: i18n keys
        run: pnpm run check:i18n
      - name: i18n copy guard
        run: pnpm run check:i18n:copy
      - name: Changelog/version guard
        run: pnpm run changelog:check
      # internal — PR-time mirror of the release-blocking rotation gate so a
      # license-key SLA breach surfaces the week it happens instead of on
      # release day. Note main can go red purely by time passing the SLA;
      # that pressure is deliberate — rotate per docs/RELEASE_SECURITY.md.
      - name: License-key rotation policy
        run: pnpm run check:license-rotation
      - name: Tests
        run: pnpm test
      - name: Curated project template runtime smoke
        run: pnpm run smoke:project-templates
      - name: Upload project template smoke artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-template-runtime-smoke
          path: output/project-template-smoke/project-template-smoke-summary.json
          if-no-files-found: error
      # implementation — the update-server has its own tsconfig and
      # vitest config outside the root TypeScript project. Wire both
      # gates into CI so the `/update/:platform/:version` smoke landed
      # for internal actually gates pull requests. Run block uses only
      # static pnpm commands — no github.event inputs are interpolated,
      # so the workflow is not exposed to script injection.
      - name: Update-server gates
        working-directory: update-server
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm test
      - name: Build web
        run: pnpm run build:web
      - name: Performance report
        run: pnpm run performance:report
      - name: Performance budget check
        run: pnpm run check:performance
      - name: Third-party license policy
        run: pnpm run check:licenses
      # internal — blocking production-graph audit at PR time. The release
      # pipeline already gated prod advisories; this brings the
      # same fail-closed gate to every PR so a prod high/critical dep is
      # caught before merge, not only at release. The dev-inclusive full
      # audit below stays advisory by design (see docs/RELEASE_SECURITY.md).
      - name: Production dependency audit (blocking)
        run: pnpm run check:prod-audit
      - name: Independent production dependency audits (blocking)
        run: |
          pnpm --dir license-server audit --prod --audit-level high
          pnpm --dir update-server audit --prod --audit-level high
          npm --prefix website audit --package-lock-only --omit=dev --audit-level=high
      - name: Security audit (advisory, full graph)
        run: pnpm audit --audit-level high
        continue-on-error: true

  web-e2e:
    name: Web end-to-end (Playwright)
    runs-on: ubuntu-latest
    # The suite is ~300 tests. It finishes in ~1.5 min locally on 7 workers;
    # a hosted runner has fewer, so the ceiling is generous rather than tuned.
    timeout-minutes: 30
    # PRs only, matching windows-path-hardening: this catches regressions at
    # review time, and a direct push to main has already been through it.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Pinned to the browser build the installed Playwright expects, and
      # cached on that exact version — a stale cache would silently run the
      # wrong Chromium. PLAYWRIGHT_BROWSERS_PATH=0 keeps the download inside
      # node_modules, which is where the e2e runner looks for it.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: node_modules/playwright-core/.local-browsers
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
      # A cache hit restores the binaries but not the OS packages Chromium
      # links against, so the deps step still has to run.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # The web build OOMs on the default heap; see docs/DEVELOPMENT.md.
      - name: Web end-to-end suite
        run: pnpm run test:e2e:web
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          PLAYWRIGHT_BROWSERS_PATH: '0'
      # Traces and screenshots are what make a red run diagnosable; without
      # them a failure here is just a name and a line number.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-web-e2e
          path: output/playwright/
          retention-days: 7

  windows-path-hardening:
    name: Windows platform hardening
    runs-on: windows-latest
    timeout-minutes: 20
    # Windows runners count 2× against the Actions budget, and the
    # path/npm-launcher tests are regression guards that only matter
    # when changes land on main. Skip on push (the linux-gates job
    # ran on the PR already), keep on PR so the catch is at review
    # time. Saves ~6-10 min per direct push to main.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Do not route through `pnpm test -- <file>` here: pnpm expands that to
      # `vitest run -- <file>`, and Vitest treats the path after `--` as a
      # positional arg to ignore, accidentally running the full suite on the
      # Windows-only runner. Keep this job narrowly scoped to platform-boundary
      # coverage: path permissions plus the live cmd.exe -> npm.cmd handoff.
      - name: Windows path and npm launcher guards
        run: >-
          pnpm exec vitest run
          tests/ipc/permissions.test.ts
          tests/main/dependencies.install.windows.test.ts
      # Build the real standalone archive on win32. Unit tests can prove path
      # normalization, but only GNU tar on the hosted Windows runner catches
      # drive-letter operands being mistaken for remote archive destinations.
      - name: Windows standalone CLI packaging smoke
        run: pnpm run package:cli -- --binary-only --expect-target windows-x64
