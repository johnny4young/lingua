name: CI

on:
  push:
    branches: [main]
  # Stacked pull requests use a feature branch as their base. Run the same
  # review gates for every pull request instead of silently skipping those
  # intermediate heads.
  pull_request:
  # Post-release sync opens its PR with GITHUB_TOKEN, which starts no
  # workflows, so it dispatches CI on the branch instead.
  workflow_dispatch:

# Cancel in-flight runs when a new commit lands on the same branch /
# PR — the older run becomes irrelevant the moment a fix is pushed,
# so finishing it is pure waste of GitHub Actions budget.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token: CI only reads the repo and runs gates;
# nothing here needs write scope. Jobs can still escalate per-job if a
# future step requires it.
permissions:
  contents: read

jobs:
  # The Linux gates run as parallel jobs. In one serial job a failing test
  # skipped every step behind it (the web build, the performance budget, the
  # license policy and all audits), so a red run hid whether those gates were
  # broken too. Each job repeats the pnpm install, which restores from the
  # shared cache in about 20 s; the pull request wall clock stays bounded by
  # web-e2e either way.
  static:
    name: Static gates (typecheck + lint + i18n + changelog + licenses + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # changelog:check reads the commit range since the last release tag.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
          # Key the pnpm store on every independently locked project so the
          # update-server install in the subprojects job restores from the
          # same cache entry as the root install in every Linux job.
          cache-dependency-path: |
            pnpm-lock.yaml
            license-server/pnpm-lock.yaml
            update-server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc --noEmit
      # The root tsconfig only includes src/**, so the step above never
      # type-checks tests/. This scoped pass pulls the compile-time guards
      # listed in tsconfig.test.json, such as the branded-id swap matrix in
      # tests/main/projectCapabilitiesBrand.test.ts, into a real tsc program:
      # revert a branded id to a bare string and it fails with TS2578. vitest
      # only transpiles, so this step is the one gate for those files.
      - name: Type check (tests compile guards)
        run: pnpm run typecheck:tests
      - name: Lint
        run: pnpm run lint
      - name: i18n keys
        run: pnpm run check:i18n
      - name: i18n copy guard
        run: pnpm run check:i18n:copy
      # The usage inventory is intentionally informational: indirect keys and
      # runtime-composed families cannot be proven absent by static analysis.
      - name: i18n usage inventory (advisory)
        run: pnpm run report:i18n-usage
        continue-on-error: true
      - name: Changelog/version guard
        run: pnpm run changelog:check
      # PR-time mirror of the release-blocking rotation gate so a license-key
      # SLA breach surfaces the week it happens instead of on release day.
      # main can go red purely by time passing the SLA; that pressure is
      # deliberate, rotate per docs/RELEASE_SECURITY.md.
      - name: License-key rotation policy
        run: pnpm run check:license-rotation
      - name: Third-party license policy
        run: pnpm run check:licenses
      # Blocking production-graph audit at PR time. The release pipeline
      # already gated prod advisories; this brings the same fail-closed gate
      # to every PR so a prod high/critical dependency is caught before merge,
      # not only at release. The dev-inclusive full audit below stays advisory
      # by design (see docs/RELEASE_SECURITY.md).
      - name: Production dependency audit (blocking)
        run: pnpm run check:prod-audit
      # `pnpm audit --prod` only inspects package.json "dependencies". Vite
      # INLINES the main/preload graphs, so a devDependency imported by
      # src/main (undici, ws) ships inside the packaged bundle unseen by the
      # gate above. This audits exactly that set.
      - name: Bundled dependency audit (blocking)
        run: pnpm run check:bundled-audit
      # Run every independent audit before failing so one red graph cannot
      # hide another behind the default bash -e of a multi-line run block.
      - name: Independent production dependency audits (blocking)
        run: |
          failed=0
          pnpm --dir license-server audit --prod --audit-level high || failed=1
          pnpm --dir update-server audit --prod --audit-level high || failed=1
          pnpm run check:website-audit || failed=1
          exit "$failed"
      - name: Security audit (advisory, full graph)
        run: pnpm audit --audit-level high
        continue-on-error: true

  unit:
    name: Unit tests + project template smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            license-server/pnpm-lock.yaml
            update-server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The full suite, benchmarks included. The coverage job runs the
      # instrumented pass without them, so this job is what keeps the timing
      # budgets in *.bench.test.ts gated.
      - name: Tests
        run: pnpm test
      - name: Linux standalone CLI verification smoke
        run: pnpm run package:cli -- --binary-only --expect-target linux-x64
      - name: Curated project template runtime smoke
        run: pnpm run smoke:project-templates
      - name: Upload project template smoke artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-template-runtime-smoke
          path: output/project-template-smoke/project-template-smoke-summary.json
          if-no-files-found: error

  sql-engines:
    name: SQL host against server engines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea # 16-alpine
        env:
          POSTGRES_PASSWORD: lingua
          POSTGRES_DB: orders
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364 # 8.4
        env:
          MYSQL_ROOT_PASSWORD: lingua
          MYSQL_DATABASE: billing
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -plingua"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      mssql:
        image: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718 # 2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Lingua_dev1
        ports:
          - 51433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Lingua_dev1 -Q 'SELECT 1'"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 60
      clickhouse:
        image: clickhouse/clickhouse-server@sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b # 24.8
        env:
          CLICKHOUSE_USER: lingua
          CLICKHOUSE_PASSWORD: lingua
          CLICKHOUSE_DB: analytics
        ports:
          - 58123:8123
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      libsql:
        image: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67 # latest
        ports:
          - 58080:8080
      # Neon's own proxy in front of the job's Postgres, answering SQL over HTTP.
      neonproxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy@sha256:cd2ae14edf2feafbc3330492de5c80506f77274c3bd013154cdef697bdeb768a # main
        env:
          PG_CONNECTION_STRING: postgres://postgres:lingua@postgres:5432/postgres
        ports:
          - 54444:4444
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            license-server/pnpm-lock.yaml
            update-server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The proxy reads its schema once at start, which can run before Postgres is ready.
      - name: Restart the Neon proxy
        run: |
          docker restart ${{ job.services.neonproxy.id }}
          for attempt in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:54444/ && break; sleep 1; done
      # Throwaway servers that live only for this job; the test skips without the URLs.
      - name: SQL host engine tests
        env:
          LINGUA_TEST_PG_URL: postgres://postgres:lingua@127.0.0.1:55432/orders
          LINGUA_TEST_MYSQL_URL: mysql://root:lingua@127.0.0.1:53306/billing
          LINGUA_TEST_MSSQL_URL: sqlserver://sa:Lingua_dev1@127.0.0.1:51433/lingua_it
          LINGUA_TEST_CLICKHOUSE_URL: clickhouse://lingua:lingua@127.0.0.1:58123/analytics
          LINGUA_TEST_LIBSQL_URL: http://127.0.0.1:58080
          LINGUA_TEST_NEON_HTTP_URL: http://127.0.0.1:54444/postgres
        run: pnpm exec vitest run tests/integration/sqlHostEngines.test.ts tests/integration/sqlHostServerEngines.test.ts tests/integration/sqlHttpEngines.test.ts tests/integration/sqlCopyToLocal.test.ts tests/integration/sqlDialectLexer.test.ts

  coverage:
    name: Coverage floors (instrumented unit suite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            license-server/pnpm-lock.yaml
            update-server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Enforces the measured floors in vitest.config.mts (docs/TESTING.md,
      # Coverage). It runs beside the unit job rather than replacing it,
      # because the instrumented run excludes the timing benches.
      - name: Coverage floors
        run: pnpm run test:coverage

  build-web:
    name: Web build + performance budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            license-server/pnpm-lock.yaml
            update-server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm run build:web
      # --fail-on-slack fails a category that measures under 75% of its
      # baseline: a ceiling that far above reality has stopped protecting it.
      # Only targets built in this job are measured, so the desktop renderer
      # is checked after the existing Linux desktop build below.
      - name: Performance budget check
        run: pnpm run check:performance --fail-on-slack

  desktop-bundles:
    name: Desktop bundles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Qualify the native Vite resolver on every release OS without signing
      # or publishing. Packaging/notarization remain separate release gates.
      - id: bundles
        run: pnpm run build:desktop-bundles
      - name: Desktop renderer performance budget
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run check:performance --target=renderer --fail-on-slack
      # A budget failure must not hide a bundle-config regression on the same
      # OS: run whenever the bundles built, whatever the budget step reported.
      - name: Desktop bundle config
        if: ${{ !cancelled() && steps.bundles.outcome == 'success' }}
        run: pnpm exec vitest run tests/build/desktopBundleConfig.test.ts
      # macOS provides a native display session without disabling Chromium's
      # sandbox. This is the built app + real Node IPC, not browser/CLI smoke.
      - name: Native Unicode capture and Stop smoke
        if: matrix.os == 'macos-latest' && github.event_name == 'pull_request'
        run: node scripts/smoke-native-output.mjs
      - name: Upload native output smoke evidence
        if: always() && matrix.os == 'macos-latest' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-output-smoke
          path: |
            output/playwright/native-output/result.json
            output/playwright/native-output/app.png
          retention-days: 7
      # The release runs this smoke only after signing and notarization, so a
      # renderer-gate regression otherwise surfaces at release time. An ad-hoc
      # signed --dir build exercises the same packaged app without secrets.
      - name: Package unsigned macOS app
        if: matrix.os == 'macos-latest' && github.event_name == 'pull_request'
        run: pnpm exec electron-builder --mac --dir --publish never -c.mac.identity=-
      - name: Packaged desktop smoke
        id: packaged-smoke
        if: matrix.os == 'macos-latest' && github.event_name == 'pull_request'
        env:
          LINGUA_SMOKE_TIMEOUT_MS: '240000'
        run: pnpm run smoke:desktop:packaged
      - name: Upload packaged smoke artifacts
        if: always() && matrix.os == 'macos-latest' && github.event_name == 'pull_request' && steps.packaged-smoke.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-packaged-smoke-pr
          path: output/playwright/desktop-smoke/**/*
          retention-days: 7
      # Run hosted browser qualification on macOS with the sandbox enabled.
      # Keep runner security settings unchanged; this is a synthetic local
      # website build, not a deployment or a release-asset download.
      - name: Install website smoke dependencies
        if: matrix.os == 'macos-latest' && github.event_name == 'pull_request'
        working-directory: website
        run: npm ci --no-audit --no-fund
      - name: Install website smoke Chromium
        if: matrix.os == 'macos-latest' && github.event_name == 'pull_request'
        run: pnpm exec playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
      - name: Website download browser smoke
        id: website-download-smoke
        if: matrix.os == 'macos-latest' && github.event_name == 'pull_request'
        run: node scripts/run-website-download-smoke.mjs
      - name: Upload website download evidence
        if: always() && matrix.os == 'macos-latest' && github.event_name == 'pull_request' && steps.website-download-smoke.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-download-matrix
          path: |
            output/playwright/website-downloads/en-desktop.png
            output/playwright/website-downloads/es-desktop.png
            output/playwright/website-downloads/en-mobile.png
            output/playwright/website-downloads/es-mobile.png
          if-no-files-found: error
          retention-days: 7

  subprojects:
    name: Independent projects (Workers + website)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            license-server/pnpm-lock.yaml
            update-server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: License-server gates
        working-directory: license-server
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm test
          pnpm exec wrangler deploy --dry-run
      # The update-server has its own tsconfig and vitest config outside the
      # root TypeScript project, so both gates run here. The run block uses
      # only static pnpm commands; no github.event inputs are interpolated,
      # so the workflow is not exposed to script injection.
      - name: Update-server gates
        working-directory: update-server
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm test
          pnpm exec wrangler deploy --dry-run
      # The marketing site in website/ is a standalone npm package outside the
      # pnpm workspace. Its node:test suite had no PR-time gate: deploy-website
      # reaches it only indirectly, through the "npm test &&" prefix of
      # npm run check, post-merge on main and behind path filters. A red website
      # test therefore surfaced as a failed deploy, never as a failed review.
      #
      # Image dependency regressions exercise Astro's actual SVGO and sharp
      # installations. Install the independent npm lock before running them;
      # the root pnpm workspace does not provide the website dependency graph.
      #
      # Deliberately not filtered to website/**: three of these test files
      # assert ACROSS the repo boundary. cliDocs imports the root
      # src/cli/helpCatalog.ts, releases reads the root package.json version,
      # and v1LaunchStory reads the root README.md and tests/e2e specs. A
      # website-only path filter would let exactly those rot.
      - name: Website gates
        working-directory: website
        run: |
          npm ci --no-audit --no-fund
          npm test
      # Run only after all independently locked packages are installed. The
      # configuration models each package as its own dependency boundary, and
      # the second command plants then removes one unused file per boundary to
      # prove that a missing workspace cannot make the gate silently green.
      - name: Dead-code analysis across package boundaries
        run: |
          pnpm run check:deadcode
          pnpm run check:deadcode:config
      - name: Website download smoke types
        run: pnpm exec tsc --noEmit -p tsconfig.website-downloads.json

  web-e2e:
    name: Web end-to-end (Playwright) ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    # The suite is ~340 tests. It finishes in ~1.5 min locally on 7 workers;
    # a hosted runner has fewer, so the ceiling is generous rather than tuned.
    timeout-minutes: 30
    # PRs only, matching windows-path-hardening: this catches regressions at
    # review time, and a direct push to main has already been through it.
    if: github.event_name == 'pull_request'
    # Three shards on separate runners. Unsharded, the suite ran 338 tests on
    # a hosted runner's 2 workers in about 15.5 min and bounded every pull
    # request. Each shard builds its own dist/web (about 6 s) rather than
    # sharing one, because a build and the dev license keypair minted for it
    # belong together. fail-fast stays off so one red shard does not discard
    # the other shards' results, and re-running failed jobs repeats only the
    # shard that failed.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Pinned to the browser build the installed Playwright expects, and
      # cached on that exact version — a stale cache would silently run the
      # wrong Chromium. PLAYWRIGHT_BROWSERS_PATH=0 keeps the download inside
      # node_modules, which is where the e2e runner looks for it.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: node_modules/playwright-core/.local-browsers
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
      # A cache hit restores the binaries but not the OS packages Chromium
      # links against, so the deps step still has to run.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # The same-origin e2e web build OOMs on the default heap; see
      # docs/DEVELOPMENT.md, Web build, Heap for the same-origin e2e build.
      - name: Web end-to-end suite
        run: pnpm run test:e2e:web --shard="$SHARD/3"
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          PLAYWRIGHT_BROWSERS_PATH: '0'
          SHARD: ${{ matrix.shard }}
      # Traces and screenshots are what make a red run diagnosable; without
      # them a failure here is just a name and a line number.
      - name: Upload first-use visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-use-web-shard-${{ matrix.shard }}
          path: output/playwright/**/first-use-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Shards run in the same workflow run, and artifact names must be
          # unique within a run.
          name: playwright-web-e2e-shard-${{ matrix.shard }}
          path: output/playwright/
          retention-days: 7
      - name: Upload Capsule Workspace integrity visual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capsule-integrity-web-shard-${{ matrix.shard }}
          path: output/playwright/**/capsule-workspace-integrity-*.png
          if-no-files-found: ignore
          retention-days: 7

  windows-path-hardening:
    name: Windows platform hardening
    runs-on: windows-latest
    timeout-minutes: 20
    # Windows runners count 2× against the Actions budget, and the
    # path/npm-launcher tests are regression guards that only matter
    # when changes land on main. Skip on push (the linux-gates job
    # ran on the PR already), keep on PR so the catch is at review
    # time. Saves ~6-10 min per direct push to main.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Do not route through `pnpm test -- <file>` here: pnpm expands that to
      # `vitest run -- <file>`, and Vitest treats the path after `--` as a
      # positional arg to ignore, accidentally running the full suite on the
      # Windows-only runner. Keep this job narrowly scoped to platform-boundary
      # coverage: path permissions plus the live cmd.exe -> npm.cmd handoff.
      - name: Windows path and npm launcher guards
        run: >-
          pnpm exec vitest run
          tests/ipc/permissions.test.ts
          tests/main/gitSecurity.test.ts
          tests/main/projectTests.test.ts
          tests/main/nativeRunLifecycle.test.ts
          tests/main/nativeProcessTree.windows.test.ts
          tests/main/windowsHostResolution.windows.test.ts
          tests/main/processTree.test.ts
          tests/shared/projectBundle.test.ts
          tests/main/dependencies.install.windows.test.ts
          tests/shared/python/interpreter.test.ts
          tests/cli/commands/capsuleVerify.test.ts
          tests/cli/capsuleVerifyBundle.test.ts
          tests/cli/capsuleRegressionBundle.test.ts
          tests/cli/commands/capsuleSuiteBudget.test.ts
          tests/scripts/isDirectInvocation.test.ts
      # Build the real standalone archive on win32. Unit tests can prove path
      # normalization, but only GNU tar on the hosted Windows runner catches
      # drive-letter operands being mistaken for remote archive destinations.
      - name: Windows standalone CLI packaging smoke
        run: pnpm run package:cli -- --binary-only --expect-target windows-x64
