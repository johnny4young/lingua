# After a release is published, the website still pins the previous public CLI
# and distribution manifests until a sync lands, and the release-event website
# deploy fails its recipe check meanwhile. Open that sync PR automatically.
# Merge it only after the npm package is public: the PR body says so.
name: Post-release sync

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable tag to sync, for example v1.6.0
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: post-release-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Open the published-release sync PR
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate the release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable vX.Y.Z tag, got '${RELEASE_TAG}'."
            exit 1
          fi
          if [[ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" != "false" ]]; then
            echo "::error::${RELEASE_TAG} is not a published release."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Regenerate published surfaces
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          release_date="$(gh release view "${RELEASE_TAG}" --json publishedAt --jq '.publishedAt[0:10]')"
          gh release download "${RELEASE_TAG}" --pattern SHA256SUMS.txt --dir "${RUNNER_TEMP}"
          node scripts/generate-distribution-manifests.mjs \
            --tag "${RELEASE_TAG}" \
            --checksums "${RUNNER_TEMP}/SHA256SUMS.txt" \
            --release-date "${release_date}"
          node scripts/pin-public-cli-version.mjs --version "${version}"
          npm --prefix website ci --no-audit --no-fund
          npm --prefix website run sync:release
          npm --prefix website run sync:content

      - name: Open the sync pull request
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Published surfaces already match ${RELEASE_TAG}; nothing to open."
            exit 0
          fi
          branch="release-sync/${RELEASE_TAG}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898333+github-actions[bot]@users.noreply.github.com'
          git switch -c "${branch}"
          git add -A packaging website/src
          git commit -m "docs(website): sync published ${RELEASE_TAG} surfaces"
          git push --force-with-lease origin "${branch}"
          cat > "${RUNNER_TEMP}/pr-body.md" <<EOF
          Generated by the Post-release sync workflow after ${RELEASE_TAG} was published.

          - Website release snapshot and changelog data refreshed from the public release.
          - CLI recipes (EN/ES) pinned to \`@linguacode/cli@${RELEASE_TAG#v}\`.
          - Homebrew cask/formula and local winget manifests regenerated from the published \`SHA256SUMS.txt\`.

          **Merge only after \`@linguacode/cli@${RELEASE_TAG#v}\` is public on npm.** Publishing the site first advertises a package users cannot install.
          EOF
          if ! gh pr view "${branch}" >/dev/null 2>&1; then
            # Repositories may forbid Actions from opening PRs; the pushed
            # branch is the deliverable, so hand it to the maintainer instead.
            if ! gh pr create --base main --head "${branch}" \
              --title "docs(website): sync published ${RELEASE_TAG} surfaces" \
              --body-file "${RUNNER_TEMP}/pr-body.md"; then
              compare="https://github.com/${GH_REPO}/compare/main...${branch}?expand=1"
              echo "::warning::Could not open the sync PR with GITHUB_TOKEN. Open it from ${compare} and merge it only after the npm package is public."
              echo "Open the ${RELEASE_TAG} sync PR: ${compare}" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi
          # Pushes and PRs made with GITHUB_TOKEN start no workflows; dispatch CI
          # on the branch so the PR still gets its checks.
          gh workflow run ci.yml --ref "${branch}"
