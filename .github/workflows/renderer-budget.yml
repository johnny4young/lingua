name: Renderer budget

# PR CI checks web and the already-built Linux desktop renderer separately.
# This weekly/manual lane additionally checks both targets together.
on:
  workflow_dispatch:
  schedule:
    # Mondays at 06:17 UTC.
    - cron: '17 6 * * 1'

concurrency:
  group: renderer-budget-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  renderer-budget:
    name: Renderer and web performance budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm run build:web
      - name: Build desktop bundles
        run: pnpm run build:desktop-bundles
      # Every baseline target must be present and inside its budget, and a
      # category measuring under 75% of its baseline fails as slack.
      - name: Performance budget check (all targets)
        run: pnpm run check:performance --require-all-targets --fail-on-slack
