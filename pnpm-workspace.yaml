# pnpm settings for the Lingua root project (single project, not a
# workspace — the update-server and license-server are independent
# projects with their own pnpm-workspace.yaml).
#
# nodeLinker: hoisted — electron-forge / electron-builder expect a flat
# node_modules layout (the same shape npm produced). pnpm's default
# symlinked store breaks native-module unpacking + the forge packagers,
# so the whole desktop build is pinned to a hoisted layout.
nodeLinker: hoisted

# macOS releases cross-package arm64 + x64 apps on one runner. Install both
# architecture-specific optional binary packages so build resources never put
# the runner's architecture into the other app. Other release platforms keep
# their current CPU plus these common desktop targets.
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - arm64
    - x64

# pnpm 11 blocks dependency build scripts by default (supply-chain
# hardening). allowBuilds re-enables only the ones Lingua needs:
# electron's postinstall downloads the platform binary, esbuild fetches its
# native binary, and node-pty compiles the reviewed PTY addon used only by the
# desktop project terminal. Everything else stays blocked.
allowBuilds:
  electron: true
  esbuild: true
  # Root deploy-web uses Wrangler for Cloudflare Pages direct uploads.
  # Wrangler's install graph needs workerd and sharp build scripts.
  sharp: true
  workerd: true
  node-pty: true

# Reject git/tarball subdependencies; all tooling resolves from the registry.
blockExoticSubdeps: true

# Dependency overrides. pnpm does NOT read npm's top-level `overrides`
# field, and (unlike npm) does NOT honor the `$name` self-reference, so
# the dompurify patch has to be restated here with an explicit spec or
# Monaco ships its declared (older) DOMPurify — a real security
# regression the tests/build/depFreshness gate guards against. Force
# Monaco's transitive dompurify up to the patched root range. Keep this
# in lockstep with the root `dependencies.dompurify` range on bumps. The
# npm-style `overrides` block stays in package.json too (npm-compat +
# asserted by the depFreshness test).
overrides:
  "monaco-editor>dompurify": "^3.4.15"
  # Security patch pins. Keep each brace-expansion override inside its
  # existing major so legacy Electron tooling does not receive a breaking
  # transitive upgrade. The remaining pins are patch/minor-compatible with
  # their parents and remove known advisories from the install graph.
  # Every security pin below is a RANGE (caret inside the major, tilde on
  # the packaging-critical yauzl) rather than an exact version: an exact
  # pin froze the tree one patch below a fix more than once (nanoid,
  # undici, brace-expansion), because the next advisory never re-opens the
  # pin by itself. minimumReleaseAge still keeps day-old releases out.
  "brace-expansion@1.1.15": "^1.1.18"
  # nanoid <3.3.18: custom generators can loop indefinitely when size is
  # zero. Build-tooling only (postcss), but the website audit gate is
  # blocking and its previous EXACT pin (3.3.17) froze the tree one patch
  # below the fix — range pins so the next advisory bump flows through.
  "nanoid": "^3.3.18"
  "brace-expansion@2.1.1": "^2.1.4"
  "brace-expansion@5.0.6": "^5.0.9"
  # 3.1.6 fixes host normalization advisories; widening the old 3.1.5 pin
  # alone still permits a vulnerable frozen lockfile. Keep a patched floor.
  "fast-uri": "^3.1.6"
  # js-yaml 4.3.2 counts empty merge sources against maxTotalMergeKeys
  # (GHSA-2883-xcg3-v3hh). electron-updater ships this parser to users;
  # keep the patched floor here and in the independently locked website.
  "js-yaml": "^4.3.2"
  # hono ships to users: @modelcontextprotocol/node (a production
  # dependency behind the desktop local MCP server) pins @hono/node-server
  # 1.x, which resolves hono itself. Keep it on the patched 4.x line; the
  # MCP package peer-accepts ^4.11.4, so this stays inside its range.
  "hono": "^4.13.7"
  # postcss reaches the tree only through Vite / Tailwind / autoprefixer
  # build tooling, never the packaged artifact. Patch-line pin so the
  # advisory audit stays quiet.
  "postcss": "^8.5.25"
  # undici is bundled into the desktop main process by Vite (see
  # src/main/httpProxy.ts), so its version ships even though it is only a
  # devDependency and `pnpm audit --prod` cannot see it. The app is on
  # undici 8; this floor covers the 7.x line only, because consumers disagree
  # across majors: jsdom 30 requires ^8.9 while wrangler's miniflare pins
  # 7.29.0 exactly, and a bare `undici` key forces one major onto both.
  # node-gyp in electron-builder's rebuild chain declares 6.x and resolves to
  # 6.28.1, the latest 6.x, with no advisory. undici-types is separate: it
  # follows @types/node, not the runtime.
  "undici@7": "^7.29.0"
  # electron-builder's @electron/rebuild maps Electron versions to Node ABIs
  # through node-abi, and the lockfile had it on 4.31.0, which predates
  # Electron 44: packaging failed with could not detect abi for 44.3.0. 4.35
  # carries the Electron 44 entry. Raise this floor with each Electron major.
  "node-abi@4": "^4.35.0"
  # plist pulls @xmldom/xmldom on two lines, 0.8 through plist 3.1.0 and 0.9
  # through plist 3.1.1. The advisory-fixed patches fit both declared ranges,
  # so these floors only stop a lockfile from sliding back below them.
  "@xmldom/xmldom@0.8": "^0.8.15"
  "@xmldom/xmldom@0.9": "^0.9.12"
  # tar 7 feeds electron-builder's packaging chain (app-builder-lib, node-gyp
  # 12). GHSA-r292-9mhp-454m reaches it through 7.5.20; both consumers accept
  # the 7.5.21 fix. Removing the residual Forge graph also removes tar 6.
  "tar@7": "^7.5.21"
  "ws": "^8.21.1"
  # tmp <0.2.6 has a path-traversal advisory (GHSA-ph9p-34f9-6g65).
  # Keep the patched floor for fengari and packaging's tmp-promise chain.
  "tmp": "^0.2.7"

minimumReleaseAgeExclude:
  # Same-day security releases for published GitHub advisories. Exact
  # entries keep the age bypass narrow and reproducible; drop an entry once
  # the resolved version is older than the age window (ws left 8.21.0).
  - esbuild@0.28.1
