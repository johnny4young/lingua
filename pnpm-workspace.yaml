# pnpm settings for the Lingua root project (single project, not a
# workspace — the update-server and license-server are independent
# projects with their own pnpm-workspace.yaml).
#
# nodeLinker: hoisted — electron-forge / electron-builder expect a flat
# node_modules layout (the same shape npm produced). pnpm's default
# symlinked store breaks native-module unpacking + the forge packagers,
# so the whole desktop build is pinned to a hoisted layout.
nodeLinker: hoisted

# macOS releases cross-package arm64 + x64 apps on one runner. Install both
# architecture-specific optional binary packages so build resources never put
# the runner's architecture into the other app. Other release platforms keep
# their current CPU plus these common desktop targets.
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - arm64
    - x64

# pnpm 11 blocks dependency build scripts by default (supply-chain
# hardening). allowBuilds re-enables only the ones Lingua needs:
# electron's postinstall downloads the platform binary, esbuild fetches its
# native binary, and node-pty compiles the reviewed PTY addon used only by the
# desktop project terminal. Everything else stays blocked.
allowBuilds:
  electron: true
  esbuild: true
  # electron-winstaller's install script downloads the Squirrel.Windows
  # stub — only relevant on the Windows release runner, and a slow/hanging
  # download on macOS/Linux dev. Left blocked: maker-squirrel fetches
  # Squirrel at make time on the Windows job. TODO (release verification):
  # confirm the Windows installer still builds in CI with this blocked;
  # flip to true on the Windows runner via a CI-local pnpm setting if not.
  electron-winstaller: false
  # Root deploy-web uses Wrangler for Cloudflare Pages direct uploads.
  # Wrangler's install graph needs workerd and sharp build scripts.
  sharp: true
  workerd: true
  node-pty: true

# implementation  — supply-chain hardening re-enabled. electron-forge 7.x pulls
# @electron/rebuild@3.7.2 → @electron/node-gyp, which was declared as a
# git-URL dependency, forcing pnpm to fetch an exotic codeload.github.com
# tarball and making us relax this block. The fork now publishes to the npm
# registry, so the `@electron/node-gyp` override above pins the registry
# release and the git tarball is gone from the lockfile — the guard is back
# on so a future exotic (git/tarball) subdependency fails the install.
blockExoticSubdeps: true

# Dependency overrides. pnpm does NOT read npm's top-level `overrides`
# field, and (unlike npm) does NOT honor the `$name` self-reference, so
# the dompurify patch has to be restated here with an explicit spec or
# Monaco ships its declared (older) DOMPurify — a real security
# regression the tests/build/depFreshness gate guards against. Force
# Monaco's transitive dompurify up to the patched root range. Keep this
# in lockstep with the root `dependencies.dompurify` range on bumps. The
# npm-style `overrides` block stays in package.json too (npm-compat +
# asserted by the depFreshness test).
overrides:
  # implementation  — @electron/rebuild@3.7.2 (pulled by @electron-forge 7.x)
  # declared @electron/node-gyp as a git-URL dependency, forcing pnpm to
  # fetch an exotic codeload.github.com tarball and keeping
  # `blockExoticSubdeps` disabled above. The fork now publishes to the npm
  # registry, so we pin it to the registry release and re-enable the guard.
  "@electron/node-gyp": "10.2.0-electron.2"
  "monaco-editor>dompurify": "^3.4.13"
  # Security patch pins. Keep each brace-expansion override inside its
  # existing major so legacy Electron tooling does not receive a breaking
  # transitive upgrade. The remaining pins are patch/minor-compatible with
  # their parents and remove known advisories from the install graph.
  "brace-expansion@1.1.15": "1.1.18"
  # ip-address <=10.3.0 carries three advisories (leading-zero octets decoded
  # as decimal, a CIDR suffix suppressing special-use detection, and
  # IPv4-mapped/NAT64 misclassification). It reaches the tree only through
  # dev tooling (@electron/rebuild -> make-fetch-happen -> socks), but 10.3.1
  # is a compatible patch inside socks' declared range, so move the whole
  # graph onto it rather than reasoning about reachability.
  #
  # extract-zip (same @electron-forge/shared-types branch) has NO patched
  # release for its symlink-traversal advisory — every published version is
  # in range. There is nothing to pin; the alert is dismissed as not_used
  # because the extraction path belongs to @electron/packager, which this
  # repo replaced with electron-builder (plugin-vite is imported only for
  # ViteConfigGenerator in scripts/build-desktop-bundles.mjs). Re-check if
  # packaging ever moves back to Forge or extract-zip publishes a fix.
  "ip-address": "^10.3.1"
  # nanoid <3.3.18: custom generators can loop indefinitely when size is
  # zero. Build-tooling only (postcss), but the website audit gate is
  # blocking and its previous EXACT pin (3.3.17) froze the tree one patch
  # below the fix — range pins so the next advisory bump flows through.
  "nanoid": "^3.3.18"
  "brace-expansion@2.1.1": "2.1.4"
  "brace-expansion@5.0.6": "5.0.9"
  "fast-uri": "3.1.5"
  # js-yaml: GHSA-5p4m-2wfm-xmqj (quadratic CPU in !!omap resolution) lands
  # on 4.3.1; the fix was NOT backported to 3.x. It reaches the tree through
  # electron-updater, which ships to users, so this pin has to move with the
  # advisory rather than stay frozen where it was first set.
  "js-yaml": "4.3.1"
  # hono ships to users: @modelcontextprotocol/node (a production
  # dependency behind the desktop local MCP server) pins @hono/node-server
  # 1.x, which resolves hono itself. Keep it on the patched 4.x line; the
  # MCP package peer-accepts ^4.11.4, so this stays inside its range.
  "hono": "4.12.34"
  # postcss reaches the tree only through Vite / Tailwind / autoprefixer
  # build tooling, never the packaged artifact. Patch-line pin so the
  # advisory audit stays quiet.
  "postcss": "8.5.25"
  # undici is bundled into the desktop main process by Vite (see
  # src/main/httpProxy.ts), so its version ships even though it is only a
  # devDependency and `pnpm audit --prod` cannot see it. Keep it on the
  # patched 7.x line that undici-types@7 also targets.
  "undici": "7.29.0"
  "ws": "8.21.0"
  # Electron Forge's macOS packager extracts the Electron ZIP through
  # extract-zip -> yauzl. With yauzl 2.x under Node 24.16.x, that extract
  # can let the process exit before the promise resolves, so Forge exits 0
  # without out/make artifacts. Keep the release workflow on Node 24.x by
  # moving only the ZIP reader forward instead of pinning Node.
  "yauzl": "3.3.1"
  # tmp <0.2.6 has a path-traversal advisory (GHSA-ph9p-34f9-6g65). It
  # reaches the tree only through dev/build tooling — @electron-forge's
  # @inquirer/editor prompts and the fengari → electron-installer Linux
  # makers — so the release-blocking `pnpm audit --prod` was already
  # clean. Force the patched 0.2.7 anyway to clear the advisory from the
  # full (advisory) audit and keep the dev toolchain off the vulnerable
  # range.
  #
  # tar: the remaining node-tar advisories publish fixes only on 7.5.19+
  # while every path here runs through dev-only @electron/rebuild →
  # node-gyp/cacache packages that still declare tar@^6. Do not force the
  # 6→7 major blindly: it needs make:desktop validation on every release
  # platform or an upstream toolchain update. `pnpm audit --prod` stays
  # clean and the dev-inclusive audit remains advisory by policy; re-check
  # on the next @electron-forge bump (see the TODO above).
  "tmp": "^0.2.7"

# Electron 43.1.1 is an explicit same-day upgrade. Keep pnpm's global
# minimum-release-age hardening for every other package while allowing this
# reviewed runtime release to install reproducibly.
minimumReleaseAgeExclude:
  - electron@43.1.1
  # Same-day security releases for published GitHub advisories. Exact pins
  # keep the age bypass narrow and reproducible.
  - esbuild@0.28.1
  - ws@8.21.0
