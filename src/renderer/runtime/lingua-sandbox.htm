<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
</head><body><script>
(function () {
  // Never become a same-origin HTML injection endpoint, even if embedded
  // without the required sandbox attribute or opened as a top-level page.
  if (parent === window || window.origin !== 'null') return;
  var token = new URL(location.href).searchParams.get('load');
  if (!token) return;
  function receive(event) {
    var message = event.data;
    if (event.source !== parent || !message || message.type !== 'lingua-sandbox-document'
        || message.token !== token || typeof message.html !== 'string') return;
    window.removeEventListener('message', receive);
    document.open();
    document.write(message.html);
    document.close();
  }
  window.addEventListener('message', receive);
  parent.postMessage({ type: 'lingua-sandbox-ready', token: token }, '*');
})();
</script></body></html>
